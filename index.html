<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointe</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f3f4f6;
        --glass: rgba(255, 255, 255, 0.6);
        --card: #ffffff;
        --input: #eef2ff;
        --text: #111;
        --primary: #4f46e5;
        --green: #16a34a;
        --red: #dc2626;

        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --smooth: cubic-bezier(0.16, 1, 0.3, 1);
      }

      body.dark {
        --bg: #0f172a;
        --glass: rgba(30, 41, 59, 0.6);
        --card: #1e293b;
        --input: #2a3447;
        --text: #e2e8f0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont;
        background: var(--bg);
        color: var(--text);
        padding: 12px;
        transition: 0.5s var(--ease);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 26px;
        font-weight: 700;
        background: linear-gradient(45deg, #4f46e5, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .logo span {
        font-size: 12px;
        margin-left: 6px;
        color: var(--text);
      }

      .right {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .toggle {
        cursor: pointer;
      }

      .insta {
        font-size: 20px;
        color: var(--text);
      }

      .card {
        background: var(--glass);
        backdrop-filter: blur(14px);
        padding: 12px;
        border-radius: 14px;
        margin-top: 10px;
        transition: 0.4s var(--smooth);
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      }

      .top {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 10px;
        border: none;
        background: var(--input);
        color: var(--text);

        transition:
          transform 0.25s var(--smooth),
          box-shadow 0.25s var(--smooth),
          background 0.3s;
      }

      input:focus {
        transform: scale(1.04);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        outline: none;
      }

      input:active {
        transform: scale(0.98);
      }

      .module {
        background: var(--card);
        padding: 12px;
        border-radius: 14px;
        margin-top: 10px;
        animation: slideIn 0.5s var(--ease);
        transition: 0.3s var(--smooth);
      }

      .module:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      @keyframes slideIn {
        0% {
          opacity: 0;
          transform: translateY(-30px) scale(0.95);
        }
        60% {
          opacity: 1;
          transform: translateY(6px) scale(1.02);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }

      .removing {
        animation: removeAnim 0.3s forwards;
      }

      @keyframes removeAnim {
        to {
          opacity: 0;
          transform: scale(0.9) translateX(40px);
        }
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .note {
        text-align: center;
        font-weight: bold;
        margin-top: 5px;
      }

      .need {
        text-align: center;
        font-size: 12px;
      }

      .green {
        color: var(--green);
      }

      .red {
        color: var(--red);
      }

      button {
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.2s var(--smooth),
          box-shadow 0.2s;
      }

      button:active {
        transform: scale(0.94);
      }

      .add {
        width: 100%;
        background: linear-gradient(45deg, #4f46e5, #06b6d4);
        color: white;
        margin-top: 10px;
      }

      .del {
        background: #ef4444;
        color: white;
        margin-top: 5px;
        width: 100%;
      }

      label {
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="logo">
        Pointe
        <span>by Moo</span>
      </div>

      <div class="right">
        <a href="https://www.instagram.com/moo.in2k/" target="_blank" class="insta">
          <i class="fa-brands fa-instagram"></i>
        </a>

        <div class="toggle" onclick="toggleDark()">🌙</div>
      </div>
    </div>

    <div class="top">
      <div class="card">
        S1
        <input id="s1" type="number" />
      </div>

      <div class="card">
        S2
        <div id="s2">0</div>
      </div>

      <div class="card">
        Year
        <div id="year">0</div>
      </div>

      <div class="card">
        Status
        <div id="status">-</div>
      </div>
    </div>

    <div class="card">
      ⚙️ Coefficients (must = 1)

      <div class="row">
        <div>
          <label>Exam Coef</label>
          <input id="examCoef" type="number" step="0.1" value="0.6" />
        </div>

        <div>
          <label>TD Coef</label>
          <input id="tdCoef" type="number" step="0.1" value="0.4" />
        </div>
      </div>

      <div id="coefError" style="color: red; font-size: 12px"></div>
    </div>

    <button class="add" onclick="addModule()">+ Add Module</button>

    <div id="modules"></div>

    <script>
      function animateValue(el, start, end, duration = 300) {
        let startTime = null;

        function animate(t) {
          if (!startTime) startTime = t;

          let p = Math.min((t - startTime) / duration, 1);
          let val = start + (end - start) * p;

          el.innerText = val.toFixed(2);

          if (p < 1) requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      }

      function addModule(data = {}) {
        let div = document.createElement("div");

        div.className = "module";

        div.innerHTML = `
<input class="name" placeholder="Module" value="${data.name || ""}">

<div class="row">
<input class="coef" type="number" placeholder="Coef" value="${data.coef || ""}">
<input class="exam" type="number" placeholder="Exam" value="${data.exam || ""}">
</div>

<div class="row">
<input class="td" type="number" placeholder="TD" value="${data.td || ""}">
<input class="tp" type="number" placeholder="TP" value="${data.tp || ""}">
</div>

<button class="del">Delete</button>

<div class="note">0</div>
<div class="need">-</div>
`;

        document.getElementById("modules").prepend(div);

        div.querySelectorAll("input").forEach((i) => {
          i.oninput = calculate;
        });

        div.querySelector(".del").onclick = () => {
          div.classList.add("removing");

          setTimeout(() => {
            div.remove();
            calculate();
          }, 300);
        };

        calculate();
      }

      function saveData() {
        let modules = [];

        document.querySelectorAll(".module").forEach((m) => {
          modules.push({
            name: m.querySelector(".name").value,
            coef: m.querySelector(".coef").value,
            exam: m.querySelector(".exam").value,
            td: m.querySelector(".td").value,
            tp: m.querySelector(".tp").value,
          });
        });

        localStorage.setItem(
          "pointeData",
          JSON.stringify({
            s1: s1Input.value,
            examCoef: examCoefInput.value,
            tdCoef: tdCoefInput.value,
            darkMode: document.body.classList.contains("dark"),
            modules,
          }),
        );
      }

      function loadData() {
        let data = JSON.parse(localStorage.getItem("pointeData"));

        if (!data) return;

        s1Input.value = data.s1 || "";
        examCoefInput.value = data.examCoef || 0.6;
        tdCoefInput.value = data.tdCoef || 0.4;

        if (data.darkMode) {
          document.body.classList.add("dark");
        }

        document.getElementById("modules").innerHTML = "";

        if (data.modules?.length) {
          data.modules.forEach((m) => addModule(m));
        }

        calculate();
      }

      function calculate() {
        let examCoef = parseFloat(examCoefInput.value) || 0;
        let tdCoef = parseFloat(tdCoefInput.value) || 0;

        if ((examCoef + tdCoef).toFixed(2) != 1) {
          coefError.innerText = "Sum must be 1";
          return;
        } else {
          coefError.innerText = "";
        }

        let modules = document.querySelectorAll(".module");

        let total = 0;
        let coefSum = 0;

        modules.forEach((m) => {
          let exam = parseFloat(m.querySelector(".exam").value) || 0;
          let coef = parseFloat(m.querySelector(".coef").value) || 0;

          let td = parseFloat(m.querySelector(".td").value);
          let tp = parseFloat(m.querySelector(".tp").value);

          let note;

          if (isNaN(td) && isNaN(tp)) {
            note = exam;
          } else if (isNaN(tp)) {
            note = exam * examCoef + td * tdCoef;
          } else {
            let shared = tdCoef / 2;

            note = exam * examCoef + td * shared + tp * shared;
          }

          let n = m.querySelector(".note");

          n.innerText = note.toFixed(2);
          n.className = "note " + (note >= 10 ? "green" : "red");

          let need;

          if (isNaN(td) && isNaN(tp)) {
            need = 10;
          } else if (isNaN(tp)) {
            need = (10 - td * tdCoef) / examCoef;
          } else {
            let shared = tdCoef / 2;

            need = (10 - (td * shared + tp * shared)) / examCoef;
          }

          let needDiv = m.querySelector(".need");

          if (note >= 10) {
            needDiv.innerText = "✔ Passed";
            needDiv.className = "need green";
          } else if (need <= 20) {
            needDiv.innerText = "Need Exam ≈ " + need.toFixed(2);
            needDiv.className = "need red";
          } else {
            needDiv.innerText = "Impossible";
            needDiv.className = "need red";
          }

          total += note * coef;
          coefSum += coef;
        });

        let s2 = coefSum ? total / coefSum : 0;

        let s1 = parseFloat(s1Input.value);

        let year = !isNaN(s1) ? (s1 + s2) / 2 : s2;

        animateValue(s2El, 0, s2);
        animateValue(yearEl, 0, year);

        statusEl.innerText = year >= 10 ? "Admitted" : "Retake";

        statusEl.className = year >= 10 ? "green" : "red";

        saveData();
      }

      function toggleDark() {
        document.body.classList.toggle("dark");

        saveData();
      }

      const s1Input = document.getElementById("s1");
      const examCoefInput = document.getElementById("examCoef");
      const tdCoefInput = document.getElementById("tdCoef");

      const coefError = document.getElementById("coefError");

      const s2El = document.getElementById("s2");
      const yearEl = document.getElementById("year");
      const statusEl = document.getElementById("status");

      s1Input.oninput = calculate;
      examCoefInput.oninput = calculate;
      tdCoefInput.oninput = calculate;

      loadData();

      if (!document.querySelector(".module")) {
        addModule();
      }
    </script>
  </body>
</html>
